<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Projetos e Cobrança</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#EEF2F8;--side:#0F2240;--side-fg:#C7D3E6;--side-mut:#7F92B0;--panel:#FFFFFF;--panel2:#F4F7FB;--line:#D8E0EC;--fg:#14213A;--mut:#5B6B85;
  --blue:#2468C8;--green:#1F9A5A;--orange:#C9781A;--red:#C8383C;--purple:#6A4FD0;--teal:#17897F;--yellow:#FFF4D6;
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--num:"Barlow Semi Condensed","Barlow",system-ui,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1526;--side:#0A1322;--side-fg:#C7D3E6;--side-mut:#6E83A3;--panel:#111E33;--panel2:#16263F;--line:#1F3150;--fg:#E8EEF8;--mut:#8EA2C0;
  --blue:#4E93F0;--green:#3FCB82;--orange:#F0A63A;--red:#F0646A;--purple:#9E85F5;--teal:#38C2B5;--yellow:#3A3018;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1526;--side:#0A1322;--side-fg:#C7D3E6;--side-mut:#6E83A3;--panel:#111E33;--panel2:#16263F;--line:#1F3150;--fg:#E8EEF8;--mut:#8EA2C0;
  --blue:#4E93F0;--green:#3FCB82;--orange:#F0A63A;--red:#F0646A;--purple:#9E85F5;--teal:#38C2B5;--yellow:#3A3018;color-scheme:dark}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.app{display:flex;min-height:100%}
/* menu lateral */
.side{width:232px;flex:none;background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto}
.brand{padding:22px 20px 18px;display:flex;gap:12px;align-items:flex-end}
.brand svg{flex:none}
.brand b{display:block;font-family:var(--num);font-size:19px;line-height:1.1;color:#fff;font-weight:700}
.nav{display:flex;flex-direction:column;padding:6px 10px;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;color:var(--side-fg);text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a[aria-current="page"]{background:#2F7FE0;color:#fff}
.nav .ico{width:18px;text-align:center;opacity:.9}
.nav hr{border:0;border-top:1px solid rgba(255,255,255,.08);margin:8px 6px}
.side-foot{margin-top:auto;padding:18px 20px 22px;font-family:var(--num);font-size:19px;line-height:1.3;color:var(--side-mut)}
.side-foot .sync{font-family:var(--font);font-size:12px;margin-top:10px;color:var(--side-mut)}
.btn.menu-btn{display:none}
.clisel{padding:2px 2px 10px}
.clisel label{display:block;font-size:12px;color:var(--side-mut);font-weight:600;margin:0 0 4px 2px}
.clisel select{background:rgba(255,255,255,.07);color:#fff;border-color:rgba(255,255,255,.14)}
.clisel select option{color:#14213A;background:#fff}
.btn.sino{margin:0 10px 8px;justify-content:flex-start;background:rgba(255,255,255,.06);border-color:transparent;color:#fff;font-weight:500}
.btn.sino:hover{border-color:rgba(255,255,255,.25)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:#E2474B;color:#fff;font-size:12px;font-weight:700;line-height:20px;text-align:center;margin-left:auto}
.badge[data-n="0"]{background:rgba(255,255,255,.15)}
.notif{list-style:none;margin:0;padding:0}
.notif li{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line)}
.notif li:last-child{border-bottom:0}
.notif a{color:var(--fg);text-decoration:none;flex:1}
.notif a:hover b{text-decoration:underline}
.notif .tag{flex:none;margin-top:2px}
.notif h4{font-family:var(--num);font-size:16px;margin:14px 0 4px}
.notif h4:first-child{margin-top:0}
/* conteúdo */
.main{flex:1;min-width:0;padding:22px 26px 40px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;margin-bottom:18px}
.top h1{margin:0;font-family:var(--num);font-size:28px;line-height:1.1;font-weight:700}
.top .sub{color:var(--mut);font-size:14px;margin-top:4px}
.top .acts{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12.5px;color:var(--mut);font-weight:600}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:38px;width:100%}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 14px;min-height:38px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:#2F7FE0;border-color:#2F7FE0;color:#fff}
.btn.danger{color:var(--red)}
.btn.big{background:#B3261E;border-color:#B3261E;color:#fff;font-size:17px;padding:12px 22px}
.hms{display:flex;gap:6px}
.hms-c{flex:1;display:flex;align-items:center;gap:4px;min-width:0}
.hms-c input{width:100%;min-width:0;padding-left:8px;padding-right:6px;-moz-appearance:textfield;appearance:textfield}
.hms-c input::-webkit-inner-spin-button,.hms-c input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.hms-c small{color:var(--mut);font-size:13px}
.btn.sm{min-height:30px;padding:4px 10px;font-weight:500;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:default}
/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,var(--blue));border-radius:6px;padding:12px 14px 11px;min-width:0}
.kpi .l{font-size:13px;color:var(--mut);font-weight:600}
.kpi .v{font-family:var(--num);font-size:26px;font-weight:700;line-height:1.15;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12.5px;color:var(--mut);margin-top:2px}
.kpi.alert .v{color:var(--red)}
.kgroup{font-family:var(--num);font-size:15px;font-weight:600;color:var(--mut);margin:18px 0 8px}
.kgroup:first-of-type{margin-top:0}
.meta{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:16px}
.meta .bar{flex:1;height:10px;background:var(--panel2);border-radius:5px;overflow:hidden}
.meta .bar i{display:block;height:100%;background:var(--green);border-radius:5px}
/* painéis */
.grid{display:grid;gap:14px;margin-bottom:14px}
.g3{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.panel h2{font-family:var(--num);font-size:18px;margin:0 0 10px;font-weight:600}
.panel.alert{border-top:3px solid var(--red)}
.panel.warn{border-top:3px solid var(--orange)}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--mut);font-size:12px;font-family:var(--font)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mut);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;color:var(--mut);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.panel td:first-child{min-width:170px}
.panel .calc td:first-child,.paper td:first-child{min-width:0}
td.n,th.n{text-align:right;white-space:nowrap}
td.c,th.c{text-align:center}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--panel2)}
.pill{display:inline-block;padding:2px 9px;border-radius:4px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-pend{background:rgba(240,166,58,.18);color:var(--orange)}
.p-prod{background:rgba(47,127,224,.16);color:var(--blue)}
.p-conc{background:rgba(47,191,113,.16);color:var(--green)}
.p-red{background:rgba(226,71,75,.16);color:var(--red)}
.amt{color:var(--orange);font-weight:600}
.neg{color:var(--red);font-weight:600}
.pos{color:var(--green);font-weight:600}
.muted{color:var(--mut)}
.empty{color:var(--mut);padding:14px 2px}
.empty b{color:var(--fg)}
.hot td{background:rgba(226,71,75,.10)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.toolbar .fld{min-width:170px}
.toolbar .grow{flex:1}
.note{font-size:13px;color:var(--mut);margin:6px 0 0}
/* formulários */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px}
.form .wide{grid-column:1/-1}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 12px}
.checks label{display:flex;gap:8px;align-items:center;font-size:14px}
.checks input{width:18px;min-height:18px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);padding:0;width:min(760px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(5,10,20,.55)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-h h3{margin:0;font-family:var(--num);font-size:20px}
.dlg-h .x{margin-left:auto}
.dlg-b{padding:16px 18px;overflow:auto;max-height:calc(90vh - 130px)}
.dlg-f{display:flex;gap:10px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:4px 0 16px}
.calc div{background:var(--panel2);border-radius:6px;padding:8px 10px}
.calc span{display:block;font-size:12px;color:var(--mut)}
.calc b{font-family:var(--num);font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#14213A;color:#fff;padding:10px 16px;border-radius:6px;font-weight:600;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25)}
/* proposta, extrato e recibo: papel */
.split{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
.paperwrap{overflow-x:auto;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:18px}
.paper{width:794px;min-height:1123px;margin:0 auto;background:#fff;color:#222;padding:48px 56px;font-family:var(--font);font-size:13px;line-height:1.5;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.paper .ph{display:flex;justify-content:space-between;gap:20px;padding-bottom:14px;border-bottom:3px solid #17325C}
.paper .co{font-family:var(--num);font-size:19px;font-weight:700;color:#17325C}
.paper .doc{font-family:var(--num);font-size:22px;font-weight:700;color:#17325C;text-align:right;line-height:1.1}
.paper .nr{color:#B3261E;font-weight:700;font-size:15px;text-align:right}
.paper .sm{font-size:11.5px;color:#666}
.paper .to{margin:18px 0 6px}
.paper .to .k{font-size:10.5px;color:#888;font-weight:600}
.paper .to .nm{font-size:16px;font-weight:700}
.paper .sec{background:#17325C;color:#fff;font-weight:600;padding:4px 10px;margin:18px 0 6px;font-size:12.5px}
.paper p{margin:0 0 4px;white-space:pre-wrap}
.paper table{font-size:12.5px;color:#222}
.paper th{color:#17325C;border-bottom:1px solid #17325C;font-size:11.5px}
.paper td{border-bottom:1px solid #ddd}
.paper .tot td{border:0;font-weight:700;color:#17325C;font-size:15px}
.paper .sign{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:56px}
.paper .sign div{border-top:1px solid #555;padding-top:6px;font-size:12px}
.paper .ph2{color:#999;font-style:italic}
.gantt{overflow-x:auto}
.gantt table{min-width:1000px;font-size:13px}
.gantt td.w{padding:0;border-left:1px solid var(--line);height:32px;text-align:center;width:46px}
.gantt td.w.now{background:rgba(240,166,58,.12)}
.gantt th.now{color:var(--orange)}
.gantt .b{display:block;height:20px;margin:6px 0;background:var(--blue);color:#fff;font-size:12px;line-height:20px}
.gantt .b.o{background:var(--orange);color:#1a1205}
.gantt .b.r{background:var(--red)}
.msg{white-space:pre-wrap;background:var(--panel2);border-radius:6px;padding:10px 12px;margin:8px 0}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;max-width:820px}
.steps li{counter-increment:s;position:relative;padding:12px 0 12px 48px;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);position:absolute;left:0;top:12px;width:32px;height:32px;border-radius:50%;background:#2F7FE0;color:#fff;display:grid;place-items:center;font-family:var(--num);font-weight:700}
.steps b{display:block}
[hidden]{display:none!important}
@media (max-width:860px){
  .app{flex-direction:column}
  .side{width:auto;height:auto;position:sticky;top:0;z-index:20;flex-direction:row;flex-wrap:wrap;align-items:center}
  .side::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--side);z-index:10}
  .brand{padding:12px 16px}.brand b{font-size:16px}.brand svg{width:26px;height:26px}
  .btn.menu-btn{display:inline-flex;margin-left:auto;margin-right:12px;background:transparent;border-color:rgba(255,255,255,.2);color:#fff}
  .nav{display:none;width:100%;padding:0 10px 10px}
  .side.open .nav{display:flex;max-height:calc(100vh - 70px);max-height:calc(100dvh - 70px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .side-foot{display:none}
  .btn.sino{margin:0 8px 0 auto;width:auto}
  .btn.sino .txt{display:none}
  .btn.sino + .btn.menu-btn{margin-left:0}
  .main{padding:16px 14px 40px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:22px}
  .split{grid-template-columns:1fr}
  .g2{grid-template-columns:1fr}
}
@media (max-width:640px){
  .rt thead{display:none}
  .rt, .rt tbody{display:block}
  .rt tr{display:block;border:1px solid var(--line);border-radius:8px;margin:0 0 10px;padding:6px 12px;background:var(--panel)}
  .rt td{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border:0;padding:5px 0;text-align:right;white-space:normal;min-width:0!important}
  .rt td::before{content:attr(data-label);color:var(--mut);font-size:12.5px;font-weight:600;text-align:left;flex:none;max-width:45%}
  .rt td[data-label=""]::before{display:none}
  .rt td:first-child{font-weight:600}
  .rt tr.hot{border-color:var(--red)}
}
@media (prefers-reduced-motion:no-preference){.kpi .v{transition:color .2s}}
.login{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:20px;overflow:auto}
.login-box{display:grid;grid-template-columns:1fr 1fr;width:min(820px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(15,34,64,.18)}
.login-marca{background:var(--side);color:#fff;padding:40px 34px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.login-marca b{font-size:26px;line-height:1.15}
.login-marca span{color:var(--side-fg);font-size:15px}
.login-form{padding:40px 34px;display:flex;flex-direction:column;gap:12px}
.login-form h1{margin:0;font-size:26px}
.login-form .note{margin:0}
.login-form .fld{display:flex;flex-direction:column;gap:4px}
.login-form input{width:100%;padding:10px 12px;font-size:16px}
.lg-senha{display:flex;gap:6px}
.lg-senha input{flex:1;min-width:0}
#pinErr{min-height:20px;color:var(--red)}
#lgEntrar{width:100%;justify-content:center;padding:11px;font-size:16px}
.login-rodape{font-size:13px}
#fbArea form{display:flex;flex-direction:column;gap:12px}
.lg-opcoes{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}
.lg-opcoes label{display:flex;align-items:center;gap:6px;cursor:pointer}
.login-form .lg-opcoes input{width:18px;height:18px;padding:0;margin:0;flex:none;accent-color:var(--blue)}
.lg-opcoes label{white-space:nowrap}
.lg-link{background:none;border:0;color:var(--blue);padding:4px 0;justify-content:center;text-decoration:underline;cursor:pointer}
@media (max-width:640px){.login-box{grid-template-columns:1fr}.login-marca{padding:24px}.login-marca b{font-size:20px}.login-form{padding:24px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="2" y="20" width="6" height="12" fill="#fff"/><rect x="10" y="13" width="6" height="19" fill="#fff"/><rect x="18" y="7" width="6" height="25" fill="#fff"/><rect x="26" y="1" width="6" height="31" fill="#4E93F0"/></svg>
      <b>Controle de Projetos e Cobrança</b>
    </div>
    <button class="btn sino" id="sino" type="button" aria-label="Notificações">🔔 <span class="txt">Notificações</span><span class="badge" id="badge" data-n="0">0</span></button>
    <button class="btn sino" id="temaBtn" type="button" aria-label="Tema">🌓 <span class="txt" id="temaTxt">Tema: automático</span></button>
    <button class="btn sino" id="sairBtn" type="button" aria-label="Sair" hidden>🚪 <span class="txt">Sair</span></button>
    <button class="btn menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav">Menu</button>
    <nav class="nav" id="nav" aria-label="Seções">
      <div class="clisel"><label for="selCli">Cliente</label><select id="selCli"></select></div>
      <a href="#dashboard" data-v="dashboard"><span class="ico">▦</span>Dashboard</a>
      <a href="#proposta" data-v="proposta"><span class="ico">✎</span>Proposta</a>
      <a href="#orcamentos" data-v="orcamentos"><span class="ico">≡</span>Orçamentos</a>
      <a href="#projetos" data-v="projetos"><span class="ico">◧</span>Projetos</a>
      <a href="#pagamentos" data-v="pagamentos"><span class="ico">$</span>Pagamentos</a>
      <a href="#revisoes" data-v="revisoes"><span class="ico">↻</span>Revisões</a>
      <a href="#arquivos" data-v="arquivos"><span class="ico">⇪</span>Arquivos</a>
      <a href="#pdfs" data-v="pdfs"><span class="ico">▥</span>Propostas PDF</a>
      <a href="#cronograma" data-v="cronograma"><span class="ico">▤</span>Cronograma</a>

/* valor por extenso */
function extenso(v){
  const U=["","um","dois","três","quatro","cinco","seis","sete","oito","nove"],D=["dez","onze","doze","treze","catorze","quinze","dezesseis","dezessete","dezoito","dezenove"],
  T=["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"],H=["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
  const w = n => { if (n===100) return "cem"; const h=Math.floor(n/100), r=n%100, p=[]; if (h) p.push(H[h]); if (r){ if (r<10) p.push(U[r]); else if (r<20) p.push(D[r-10]); else { const t=Math.floor(r/10),u=r%10; p.push(T[t]+(u?" e "+U[u]:"")); } } return p.join(" e "); };
  v = Math.round((Number(v)||0)*100)/100; if (v >= 1e6) return ""; const i = Math.floor(v), c = Math.round((v-i)*100);
  const mil = Math.floor(i/1000), resto = i%1000; let s = "";
  if (mil) s = mil===1 ? "mil" : w(mil)+" mil";
  if (resto) s += (mil ? ((resto<=100||resto%100===0) ? " e " : " ") : "") + w(resto);
  if (i) s += i===1 ? " real" : " reais";
  if (c) s += (i ? " e " : "") + w(c) + (c===1 ? " centavo" : " centavos");
  return s || "zero reais";
}

const C = () => S.cliente;
function orcDe(nome){ return DB.orcamentos.find(o => o.projeto === nome); }
function calc(p){

  const revFeitas = DB.revisoes.filter(r => mesmo(r, p)).length;
  const revExtras = Math.max(0, revFeitas - revInc), valorExtras = revExtras * (num(c.revVal)||0);

  const marg = (num(c.margem)||0)/100;

/* ---------- gráficos SVG ---------- */
function barras(rows, series, opts={}){
  const W = 380, H = 230, m = {t:14, r:6, b:30, l:50};
  const max = Math.max(1, ...rows.flatMap(r => series.map(s => r[s.k] || 0)), opts.linha || 0);
  const step = (() => { const raw = max/4, p = 10 ** Math.floor(Math.log10(raw)); return p * [1,2,2.5,5,10].find(k => k*p >= raw); })();
  const top = Math.ceil(max/step)*step, y = v => m.t + (H-m.t-m.b) * (1 - v/top);
  const bw = (W-m.l-m.r)/Math.max(1, rows.length), g = Math.min(18, bw*0.7/series.length);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||"")}">`;
  for (let v = 0; v <= top + 1e-9; v += step) s += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${m.l-6}" y="${y(v)+4}" text-anchor="end">${v>=1000?(v/1000).toLocaleString("pt-BR")+" mil":v.toLocaleString("pt-BR")}</text>`;
  rows.forEach((r, i) => {
    const cx = m.l + bw*i + bw/2;
    series.forEach((se, k) => { const v = r[se.k] || 0, x = cx - g*series.length/2 + g*k; s += `<rect x="${x+1}" y="${y(v)}" width="${g-2}" height="${y(0)-y(v)}" fill="${se.c}" rx="2"><title>${esc(r.lab)} · ${se.n}: ${brl(v)}</title></rect>`; });
    if (rows.length <= 6 || i % 2 === 1) s += `<text x="${cx}" y="${H-m.b+16}" text-anchor="middle">${esc(String(r.lab).slice(0, rows.length > 6 ? 6 : 12))}</text>`;
  });
  if (opts.linha) s += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(opts.linha)}" y2="${y(opts.linha)}" stroke="var(--orange)" stroke-dasharray="6 4" stroke-width="2"/>`;
  return corSvg(s + "</svg>");
}
function corSvg(s){
  const cs = getComputedStyle(document.documentElement);
  return s.replace(/<text (?![^>]*fill=)/g, '<text fill="var(--mut)" font-family="Barlow, Arial, sans-serif" ')

}
function rosca(parts){
  const tot = sum(parts, p => p.v); const R = 70, r = 44, cx = 90, cy = 90; let a = -Math.PI/2, s = `<svg viewBox="0 0 180 180" width="170" height="170" style="width:170px;max-width:100%;flex:none" role="img" aria-label="Projetos por status">`;
  if (!tot) s += `<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="var(--line)" stroke-width="${R-r}"/>`;
  parts.filter(p => p.v).forEach(p => {
    const b = a + p.v/tot*Math.PI*2 - (parts.filter(x=>x.v).length > 1 ? 0.0001 : 0.0001);
    const big = b - a > Math.PI ? 1 : 0, P = (rad, ang) => `${cx + rad*Math.cos(ang)} ${cy + rad*Math.sin(ang)}`;
    s += p.v === tot ? `<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${p.c}" stroke-width="${R-r}"><title>${p.n}: ${p.v}</title></circle>`
      : `<path d="M ${P(R,a)} A ${R} ${R} 0 ${big} 1 ${P(R,b)} L ${P(r,b)} A ${r} ${r} 0 ${big} 0 ${P(r,a)} Z" fill="${p.c}"><title>${p.n}: ${p.v}</title></path>`;
    a = b;
  });
  return corSvg(s + `<text x="${cx}" y="${cy+4}" text-anchor="middle" style="font-size:30px;font-weight:700;fill:var(--fg);font-family:'Barlow Semi Condensed',Barlow,Arial,sans-serif">${tot}</text><text x="${cx}" y="${cy+24}" text-anchor="middle">projetos</text></svg>`);
}

  let y = 0; while (y < h - 0.5) { if (y > 0) pdf.addPage(); if (o.fundo) { pdf.setFillColor(o.fundo); pdf.rect(0, 0, w, pg, "F"); } pdf.addImage(img, "JPEG", 0, -y, w, h); y += pg; }

const opts = (arr, sel, vazio) => (vazio !== undefined ? `<option value="">${vazio}</option>` : "") + arr.map(o => `<option${o===sel?" selected":""}>${esc(o)}</option>`).join("");

/* horas em hora, minuto e segundo (guardadas em horas decimais) */
const hmsPartes = v => { const n = num(v); if (n == null) return {h: null, m: null, s: null}; const t = Math.round(n * 3600); return {h: Math.floor(t / 3600), m: Math.floor(t % 3600 / 60), s: t % 60}; };
const hmsLer = (v, name) => { const h = v[name + "__h"], m = v[name + "__m"], s = v[name + "__s"]; if ([h, m, s].every(x => String(x ?? "").trim() === "")) return null; return Math.round(((num(h) || 0) + (num(m) || 0) / 60 + (num(s) || 0) / 3600) * 1e6) / 1e6; };
const fh_ = (name, label, val, ref) => { const p = hmsPartes(val), q = hmsPartes(ref);
  return `<div class="fld"><label for="d_${name}__h">${label}</label><div class="hms">${[["h", "h", p.h, q.h, ""], ["m", "min", p.m, q.m, 'max="59"'], ["s", "s", p.s, q.s, 'max="59"']].map(([k, u, v, pv, mx]) =>
    `<span class="hms-c"><input id="d_${name}__${k}" name="${name}__${k}" type="number" min="0" ${mx} step="1" inputmode="numeric" value="${v ?? ""}" placeholder="${pv ?? 0}" aria-label="${label}: ${u}"><small>${u}</small></span>`).join("")}</div></div>`; };

const CAMPOS_HIST_O = {valor: "Valor do orçamento", data: "Data do pedido", entrega: "Data de entrega", sit: "Situação do orçamento", projeto: "Nome do projeto", prazo: "Prazo de pagamento", revInc: "Revisões incluídas"};

function fmtHist(k, v){ if (v == null || v === "") return "—"; if (/valor|custos/i.test(k)) return brl(num(v)); if (/^(data|entrega)$/.test(k)) return dbr(v); return String(v); }
function registrar(ref, a, b, campos){
  const quando = new Date().toISOString(), orc = ref.orc || null; let n = 0;
  for (const [k, rot] of Object.entries(campos)) { const x = a[k] ?? null, y = b[k] ?? null; if (JSON.stringify(x) === JSON.stringify(y) || ((x ?? "") === "" && (y ?? "") === "")) continue;
    DB.historico.push({id: uid(), orc, projeto: ref.projeto, quando, quem: quemSou, campo: rot, de: fmtHist(k, x), para: fmtHist(k, y)}); n++; }
  if (n) { if (DB.historico.length > 3000) DB.historico = DB.historico.slice(-3000); persistir("historico"); }
}
function reduzirImagem(f){
  return new Promise((ok, falha) => { const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => { const esc_ = Math.min(1, 500 / img.width, 200 / img.height), cv = document.createElement("canvas"); cv.width = Math.round(img.width * esc_); cv.height = Math.round(img.height * esc_);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); ok(cv.toDataURL("image/png")); };
    img.onerror = () => falha(new Error("imagem")); img.src = url; });
}
function paraLixeira(k, item, nome, junto){ DB.lixeira.push({id: uid(), k, item, nome, quando: new Date().toISOString(), ...(junto && junto.length ? {junto} : {})}); persistir("lixeira"); }

async function limparLixeira(){

const idbPdf = () => new Promise((ok, falha) => { const r = indexedDB.open("cp_pdfs", 1); r.onupgradeneeded = () => r.result.createObjectStore("pdfs"); r.onsuccess = () => ok(r.result); r.onerror = () => falha(r.error); });
async function idbOp(modo, fn){ const d = await idbPdf(); return new Promise((ok, falha) => { const t = d.transaction("pdfs", modo), q = fn(t.objectStore("pdfs")); t.oncomplete = () => ok(q && q.result); t.onerror = () => falha(t.error); }); }
const b64DeBlob = b => new Promise((ok, falha) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1] || ""); r.onerror = () => falha(r.error); r.readAsDataURL(b); });
const docPdfOnline = o => fbStore.doc(`${ESPACO}/dados/pdf_${o.id}`), parteOnline = (o, i) => fbStore.doc(`${ESPACO}/dados/pdf_${o.id}_${i}`); /* o PDF vai em partes (limite de 1 MB por registro online) */

    for (let i = 0; i < partes; i++) await parteOnline(o, i).set({b64: b64.slice(i * T, (i + 1) * T)});
    await docPdfOnline(o).set({partes, em: new Date().toISOString()});
    for (let i = partes; i < ((antigo && antigo.partes) || 0); i++) { try { await parteOnline(o, i).delete(); } catch (e) {} }
    ref = {tipo: "fb", partes}; }
  else if (!FORA) { const as = window.claude && claude.use ? await claude.use("assets") : null; if (!as) throw new Error("Armazenamento de arquivos indisponível."); const r = await as.upload(blob); ref = {tipo: "asset", id: r.id, url: r.url}; }
  else { await idbOp("readwrite", st => st.put(blob, o.id)); ref = {tipo: "idb"}; }
  o.pdf = {nome, em: new Date().toISOString(), tamanho: blob.size, ...ref};
  if (antigo && antigo.tipo === "asset" && antigo.id && antigo.id !== o.pdf.id) apagarAnexo(antigo);

async function guardarPdfSeguro(o){ if (!ultimoPdf) return false; try { await guardarPdf(o, ultimoPdf.blob, ultimoPdf.nome); return true; } catch (e) { return false; } }
async function lerPdf(o){
  const p = o && o.pdf; if (!p) return null;
  if (p.tipo === "fb") { if (!fbStore) return null; const sn = await docPdfOnline(o).get(); if (!sn.exists) return null; const n = sn.data().partes || 0; let b64 = "";
    for (let i = 0; i < n; i++) { const pt = await parteOnline(o, i).get(); if (!pt.exists) return null; b64 += pt.data().b64 || ""; } if (!b64) return null;
    const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], {type: "application/pdf"}); }
  if (p.tipo === "asset") { const r = await fetch(p.url); return r.ok ? new Blob([await r.blob()], {type: "application/pdf"}) : null; }
  if (p.tipo === "idb") return (await idbOp("readonly", st => st.get(o.id))) || null;
  return null;
}
async function apagarPdf(o){ const p = o && o.pdf; if (!p) return; try { if (p.tipo === "fb" && fbStore) { for (let i = 0; i < (p.partes || 1); i++) await parteOnline(o, i).delete(); await docPdfOnline(o).delete(); } else if (p.tipo === "asset") await apagarAnexo(p); else if (p.tipo === "idb") await idbOp("readwrite", st => st.delete(o.id)); } catch (e) {} }

const ANEXO_TEXTO = ["step","stp","iges","igs","dxf"];
async function enviarAnexo(f){
  const as = window.claude && claude.use ? await claude.use("assets") : null;
  if (!as) throw new Error("Anexos não estão disponíveis nesta visualização.");
  const ext = f.name.split(".").pop().toLowerCase();
  if (!ANEXO_EXT.includes(ext)) throw new Error("Tipo não aceito para anexo. Use PDF, imagem, STEP, IGES ou DXF (arquivos .SLDPRT/.SLDASM: anexe o STEP ou o PDF).");
  if (f.size > 20 * 1048576) throw new Error("O arquivo passa de 20 MB.");
  const blob = ANEXO_TEXTO.includes(ext) ? new Blob([f], {type: "text/plain"}) : f;
  try { const r = await as.upload(blob); return {id: r.id, url: r.url, nome: f.name, tamanho: f.size}; }
  catch (e) { throw new Error("Não foi possível anexar o arquivo (" + (e && (e.message || e.code) || "erro") + ")."); }
}
async function zipAnexos(btn){
  if (!window.JSZip) return toast("O compactador não carregou. Verifique a conexão e recarregue a página.");
  const lista = S.arquivos.filter(a => a.anexo); if (!lista.length) return;
  const txt = btn.textContent; btn.disabled = true; btn.textContent = "Preparando…";
  try {
    const z = new JSZip();
    for (const a of lista) { const r = await fetch(a.anexo.url); if (!r.ok) continue;
      const pasta = prefixoCli(cliDoRec(a)).replace(/ - $/, "") || "Sem cliente";
      z.folder(pasta).folder(nomeArq(a.projeto)).file(a.anexo.nome, await r.blob()); }
    const nome = `${SEL === "todos" ? "Todos os clientes - " : prefixoCli(SEL)}Arquivos - ${iso(hoje())}.zip`;
    const res = await salvarArquivo(nome, await z.generateAsync({type: "blob"}), {desc: "Arquivos compactados", mime: "application/zip"});
    if (res === "ok") toast("Arquivos baixados."); else if (res === "erro") toast("Não foi possível salvar os arquivos aqui.");
  } catch (e) { toast("Não foi possível juntar os arquivos."); }
  finally { btn.disabled = false; btn.textContent = txt; }
}
async function apagarAnexo(a){ try { const as = await claude.use("assets"); if (as) await as.delete(a.id); } catch (e) {} }
async function baixarAnexo(x, btn){
  if (!x || !x.anexo) return;
  const txt = btn.textContent; btn.disabled = true; btn.textContent = "Baixando…";
  try {
    const r = await fetch(x.anexo.url); if (!r.ok) throw new Error("Arquivo não encontrado.");
    const blob = await r.blob(), nome = prefixoCli(cliDoRec(x)) + x.anexo.nome, ext = nome.split(".").pop().toLowerCase();
    let res = await salvarArquivo(nome, blob, {desc: "Arquivo", mime: blob.type || "application/octet-stream"});
    if (res === "erro" && window.JSZip) { const z = new JSZip(); z.file(nome, blob); res = await salvarArquivo(nome.replace(/\.[^.]+$/, "") + ".zip", await z.generateAsync({type: "blob"}), {desc: "Arquivo compactado", mime: "application/zip"}); }
    if (res === "ok") toast("Arquivo baixado."); else if (res === "erro") toast("Não foi possível baixar o arquivo aqui.");
  } catch (e) { toast(e.message || "Não foi possível baixar o arquivo."); }
  finally { btn.disabled = false; btn.textContent = txt; }
}

/* ----- cronograma ----- */
V.cronograma = () => {
  const t = hoje(), seg = new Date(t); seg.setDate(t.getDate() - ((t.getDay()+6)%7) - 14);
  const sem = [...Array(16)].map((_, i) => { const d = new Date(seg); d.setDate(seg.getDate() + 7*i); return d; });
  const L = todos().filter(r => r.dias != null).sort((a,b) => pd(a.entrega) - pd(b.entrega));
  return `<div class="top"><div><h1>Cronograma</h1><div class="sub">Projetos em aberto por semana. Azul: em execução. Laranja: entrega em até 7 dias. Vermelho: atrasado.</div></div><div class="acts"><button class="btn" id="icsBtn" type="button">Exportar prazos para o calendário (.ics)</button></div></div>
  <div class="panel gantt">${L.length?`<table><thead><tr><th>Projeto</th><th>Início</th><th>Entrega</th><th class="n">Dias</th>${sem.map(d=>{const now=t>=d&&t<new Date(d.getTime()+7*864e5);return `<th class="c${now?" now":""}">${d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})}</th>`}).join("")}</tr></thead><tbody>
  ${L.map(r=>{const ini=pd(r.pedido)||pd(r.entrega), fim=pd(r.entrega), cls=r.dias<0?"r":r.dias<=7?"o":"";
    return `<tr><td>${esc(r.p.projeto)} <a href="${linkAgenda("Entrega: " + r.p.projeto, r.entrega, (r.num ? "Orçamento Nº " + r.num + " · " : "") + (clienteObj(cliDoRec(r.p)).nome || ""))}" target="_blank" rel="noopener" title="Adicionar ao Google Agenda" aria-label="Adicionar a entrega ao Google Agenda">📅</a></td><td>${dbr(r.pedido)}</td><td>${dbr(r.entrega)}</td><td class="n ${r.dias<0?"neg":""}">${r.dias}</td>${sem.map(d=>{const e=new Date(d.getTime()+6*864e5), on=d<=fim&&e>=ini, due=fim>=d&&fim<=e, now=t>=d&&t<=e;
      return `<td class="w${now?" now":""}">${on?`<span class="b ${cls}" title="${esc(r.p.projeto)}">${due?"◆":""}</span>`:""}</td>`}).join("")}</tr>`}).join("")}</tbody></table>`
  :`<p class="empty"><b>Nenhum projeto em aberto com data de entrega.</b></p>`}</div>`;
};

function linkAgenda(titulo, dia, detalhe){ const d = String(dia || "").replace(/-/g, ""), d2 = addDias(dia, 1).replace(/-/g, "");
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(titulo)}&dates=${d}/${d2}&details=${encodeURIComponent(detalhe || "")}`; }
async function exportarIcs(){
  const ev = [], esc_ = t => String(t || "").replace(/[\\;,]/g, m => "\\" + m).replace(/\n/g, "\\n"), agora = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  todos().forEach(r => { const cli = clienteObj(cliDoRec(r.p)).nome || "";
    if (r.dias != null && r.entrega) ev.push(["Entrega: " + r.p.projeto, r.entrega, `${cli}${r.num ? " · Orçamento Nº " + r.num : ""}`, "e" + r.p.id]);
    if (r.p.status !== "Cancelado" && r.saldo > 0 && r.venc) ev.push(["Vencimento: " + r.p.projeto + " (" + brl(r.saldo) + ")", r.venc, `${cli} · saldo a receber ${brl(r.saldo)}`, "v" + r.p.id]); });
  if (!ev.length) return toast("Não há entregas nem vencimentos em aberto para exportar.");
  const linhas = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Controle de Projetos//PT-BR", "CALSCALE:GREGORIAN"];
  ev.forEach(([t, d, det, id]) => linhas.push("BEGIN:VEVENT", `UID:${id}@controle-projetos`, `DTSTAMP:${agora}`, `DTSTART;VALUE=DATE:${d.replace(/-/g, "")}`, `DTEND;VALUE=DATE:${addDias(d, 1).replace(/-/g, "")}`, `SUMMARY:${esc_(t)}`, `DESCRIPTION:${esc_(det)}`, "BEGIN:VALARM", "TRIGGER:-P1D", "ACTION:DISPLAY", `DESCRIPTION:${esc_(t)}`, "END:VALARM", "END:VEVENT"));
  linhas.push("END:VCALENDAR");
  const txt = linhas.join("\r\n"), nome = `${SEL === "todos" ? "Todos os clientes - " : prefixoCli(SEL)}Prazos - ${iso(hoje())}.ics`;
  let res = await salvarArquivo(nome, new Blob([txt], {type: "text/calendar"}), {desc: "Calendário", mime: "text/calendar"});
  if (res === "erro" && window.JSZip) { const z = new JSZip(); z.file(nome, txt); res = await salvarArquivo(nome.replace(/\.ics$/, ".zip"), await z.generateAsync({type: "blob"}), {desc: "Calendário compactado", mime: "application/zip"}); if (res === "ok") return toast("Prazos salvos em .zip: extraia o arquivo .ics e abra no Google Agenda ou no Outlook."); }
  if (res === "ok") toast(`${ev.length} prazo(s) exportado(s). Abra o arquivo .ics no Google Agenda ou no Outlook.`); else if (res === "erro") toast("Não foi possível salvar o arquivo aqui.");
}
V.cronograma.bind = () => { $("#icsBtn").onclick = exportarIcs; };

const IMP = {
  orcamentos: {nome: "Orçamentos", chave: o => o.projeto, campos: ["num","data","valor","entrega","horas","revInc","prazo","escopo","entregaveis","obs"]},

const igual = (a, b, campos) => campos.every(k => JSON.stringify(a[k] ?? null) === JSON.stringify(b[k] ?? null) || ((a[k] ?? "") === "" && (b[k] ?? "") === ""));
function compararImport(novo){
  const out = {};
  for (const k of Object.keys(IMP)) { if (!novo[k]) continue; const d = IMP[k], atual = S[k], mapa = new Map(atual.map(x => [d.chave(x), x])), chavesNovas = new Set(novo[k].map(d.chave));
    let novos = 0, alterados = 0; novo[k].forEach(x => { const a = mapa.get(d.chave(x)); if (!a) novos++; else if (!igual(a, x, d.campos)) alterados++; });
    out[k] = {novos, alterados, removidos: atual.filter(x => !chavesNovas.has(d.chave(x))).length}; }
  return out;
}
function previaImportacao(novo){
  const cmp = compararImport(novo), linhas = Object.entries(cmp).map(([k, c]) => `<tr><td>${IMP[k].nome}</td><td class="n">${c.novos}</td><td class="n">${c.alterados}</td><td class="n ${c.removidos ? "neg" : ""}">${c.removidos}</td></tr>`).join("");
  dlg("Prévia da importação", `<p class="note" style="margin:0 0 10px">Cliente: <b>${esc(C().nome || "sem nome")}</b>. Confira o que muda antes de confirmar.</p>
    <div class="tw"><table><thead><tr><th>Área</th><th class="n">Novos</th><th class="n">Alterados</th><th class="n">Removidos*</th></tr></thead><tbody>${novo.cliente ? `<tr><td>Cliente e regras</td><td class="n">—</td><td class="n">${Object.keys(novo.cliente).some(k => JSON.stringify(novo.cliente[k] ?? "") !== JSON.stringify(S.cliente[k] ?? "")) ? "sim" : "0"}</td><td class="n">—</td></tr>` : ""}${linhas}</tbody></table></div>
    <p class="note">*Removidos: registros que existem hoje e não estão na planilha. Só são apagados em <b>Substituir tudo</b>.</p>
    <p class="note"><b>Só adicionar e atualizar</b> inclui os novos, atualiza os alterados e mantém o restante.</p>`,
    `<button class="btn danger" type="button" id="impSub">Substituir tudo</button><button class="btn pri" type="button" id="impAdd">Só adicionar e atualizar</button>`);
  $("#impSub").onclick = () => { if (!confirm("Substituir apaga os registros que não estão na planilha. Continuar?")) return; $("#dlg").close(); aplicarImport(novo, true); };

}
function aplicarImport(novo, substituir){
  if (novo.cliente) { Object.assign(S.cliente, novo.cliente); save("clientes"); }
  for (const k of ["orcamentos","projetos","pagamentos","revisoes","arquivos"]) {
    if (!novo[k]) continue; const d = IMP[k], mapa = new Map(S[k].map(x => [d.chave(x), x])), resultado = [];
    novo[k].forEach(x => { const a = mapa.get(d.chave(x));
      if (k !== "orcamentos") { const ob = S.orcamentos.find(o => o.projeto === x.projeto); if (ob) { x.orc = ob.id; if (k === "projetos") x.cliente = ob.cliente; } }
      if (a) { d.campos.forEach(c => { if (k === "projetos" && c === "valor" && x.valor == null) return; a[c] = x[c]; }); if (x.orc) a.orc = x.orc; resultado.push(a); mapa.delete(d.chave(x)); }
      else { if (k === "orcamentos") { x.cliente = SEL; x.status = "Enviado"; x.rev = 0; if (!num(x.num)) x.num = Math.max(proxNum(), ...resultado.map(o => (num(o.num) || 0) + 1)); } resultado.push(x); } });
    S[k] = substituir ? resultado : [...S[k].filter(x => !resultado.includes(x)), ...resultado];
    save(k);
  }
  render(); toast(substituir ? "Planilha importada (dados substituídos)." : "Planilha importada (novos incluídos e alterados atualizados).");
}

  $("#psAgora").onclick = async () => { try { await backupPasta(true); render(); } catch (e) { toast(e.message); } };
  $("#psRest").onclick = restaurarDaPasta;
  document.querySelectorAll("[data-rec]").forEach(b => b.onclick = () => recuperar(b.dataset.rec));
  if ($("#pinSalvar")) $("#pinSalvar").onclick = async () => { const u = $("#lgU").value.trim(), a = $("#pin1").value, b = $("#pin2").value;
    if (u.length < 3) return toast("O usuário precisa ter pelo menos 3 caracteres."); if (a.length < 6) return toast("A senha precisa ter pelo menos 6 caracteres."); if (a !== b) return toast("As senhas não conferem.");
    const inf0 = criptoInfo(), existe = !!usuarioInfo(inf0, u);
    try { const codigo = await salvarUsuario(u, a); persistir.soConfig = true; persistir("config"); persistir.soConfig = false; render();
      if (codigo) { try { sessionStorage.setItem("cp_usuario", u); } catch (e) {} mostrarCodigo(codigo); } else toast(existe ? `Senha de ${u} alterada.` : `Usuário ${u} adicionado.`); } catch (e) { toast("Não foi possível criptografar neste navegador."); } };
  document.querySelectorAll("[data-rmuser]").forEach(b => b.onclick = () => { const u = b.dataset.rmuser, inf = criptoInfo(); if (!inf || inf.users.length < 2) return;
    if (!confirm(`Remover o usuário ${u}? Ele não poderá mais entrar.`)) return; inf.users = inf.users.filter(x => x.u !== u); localStorage.setItem("cp_cripto", JSON.stringify(inf)); render(); toast(`Usuário ${u} removido.`); });
  if ($("#codNovo")) $("#codNovo").onclick = async () => { if (!confirm("Gerar um novo código de recuperação? O código antigo deixa de funcionar.")) return; try { mostrarCodigo(await novoCodigoRecuperacao()); } catch (e) { toast("Não foi possível gerar o código."); } };
  if ($("#mbAdd")) $("#mbAdd").onclick = async () => { const e = $("#mbEmail").value.trim().toLowerCase(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return toast("Digite um e-mail válido.");
    try { await fbStore.doc(ESPACO).update({membros: firebase.firestore.FieldValue.arrayUnion(e)}); espaco = {...espaco, membros: [...new Set([...(espaco.membros || []), e])]}; render(); toast(`E-mail ${e} liberado. Agora a pessoa pode criar a conta no site.`); } catch (x) { toast("Não foi possível liberar o e-mail."); } };
  document.querySelectorAll("[data-rmmembro]").forEach(b => b.onclick = async () => { const e = b.dataset.rmmembro; if (!confirm(`Remover o acesso de ${e}?`)) return;
    try { await fbStore.doc(ESPACO).update({membros: firebase.firestore.FieldValue.arrayRemove(e)}); espaco = {...espaco, membros: (espaco.membros || []).filter(x => x !== e)}; render(); toast(`Acesso de ${e} removido.`); } catch (x) { toast("Não foi possível remover o acesso."); } });
  if ($("#fbTroca")) $("#fbTroca").onclick = async () => { try { await fbAuth.sendPasswordResetEmail(fbUser.email); toast(`Enviamos para ${fbUser.email} um link para criar a nova senha.`); } catch (x) { toast(erroFb(x)); } };
  if ($("#fbSair")) $("#fbSair").onclick = sairOnline;
  if ($("#pinTravar")) $("#pinTravar").onclick = () => { try { sessionStorage.removeItem("cp_chave"); sessionStorage.removeItem("cp_ok"); sessionStorage.removeItem("cp_usuario"); } catch (e) {} location.reload(); };
  if ($("#pinRemover")) $("#pinRemover").onclick = async () => { const p = prompt("Digite a senha atual para remover o login:"); if (p == null) return; const inf = criptoInfo();
    let certa = false; if (inf && inf.v === 2) { for (const x of inf.users) { const ch = await desembrulhar(x, credencial(x.u, p)); if (ch && await testarChave(ch, inf)) { certa = true; break; } } }
    else if (inf) certa = await testarChave(await derivarChave(inf.u ? credencial(inf.u, p) : p, deb64(inf.sal)), inf);
    if (!certa) return toast("Senha incorreta.");
    await removerSenha(); render(); toast("Login removido. Os dados deste navegador não estão mais criptografados."); };
  $("#prSel").onchange = e => { DB.config.principal = e.target.value || undefined; persistir.soConfig = true; persistir("config"); persistir.soConfig = false; render(); };
  $("#prEnd").onchange = e => { DB.config.enderecoPrincipal = e.target.value.trim(); persistir.soConfig = true; persistir("config"); persistir.soConfig = false; render(); };
  $("#gdInt").onchange = e => { DB.config.driveIntervalo = e.target.value; persistir("config"); atualizarSino(); toast(e.target.value === "desligado" ? "Backup automático no Drive desligado." : "Frequência do backup no Drive salva."); };
  $("#gdAgora").onclick = async () => { const b = $("#gdAgora"); b.disabled = true; b.textContent = "Enviando…"; try { await backupDrive(); render(); } catch (e) { toast(e.message); } finally { const x = $("#gdAgora"); if (x) { x.disabled = false; x.textContent = "Fazer backup no Drive agora"; } } };
  if ($("#gdVerificar")) $("#gdVerificar").onclick = () => mostrarDrive(true);
  if ($("#gdSair")) $("#gdSair").onclick = () => { sairGoogle(); mostrarDrive(false); toast("Você saiu da conta Google nesta página."); };
  mostrarDrive(false);
  $("#bdApagar").onclick = () => { const t = prompt('Para apagar tudo, digite APAGAR'); if (t !== "APAGAR") return toast("Nada foi apagado.");
    DB = {clientes: [{...CLIENTE_PADRAO, id: uid(), codigo: 1}], orcamentos: [], projetos: [], pagamentos: [], revisoes: [], arquivos: [], config: soLocal(), lixeira: [], historico: []}; SEL = "todos"; KEYS.forEach(k => persistir(k)); render(); toast("Todos os dados foram apagados."); };
};

function preencherSel(){
  const el = $("#selCli"); if (!el) return;
  el.innerHTML = `<option value="todos">Todos os clientes</option>` + DB.clientes.map(c => `<option value="${c.id}">${p3(c.codigo)} · ${esc(c.nome || "Cliente sem nome")}</option>`).join("") + `<option value="__novo">+ Adicionar cliente</option>`;
  el.value = SEL;
}
function escolhaCliente(oque){
  return `<div class="panel"><p class="empty"><b>Escolha um cliente para ${oque}.</b></p><div class="toolbar"><div class="fld"><label for="pickCli">Cliente</label><select id="pickCli"><option value="">Escolha…</option>${DB.clientes.map(c => `<option value="${c.id}">${esc(c.nome || "Cliente sem nome")}</option>`).join("")}</select></div><button class="btn" type="button" id="pickNovo">Adicionar cliente</button></div></div>`;
}
function ligarEscolha(){ const p = $("#pickCli"); if (p) p.onchange = e => { if (e.target.value) escolherCliente(e.target.value); }; const n = $("#pickNovo"); if (n) n.onclick = novoCliente; }
function render(){
  montarVisao(); preencherSel();
  const v = vista();
  document.querySelectorAll(".nav a").forEach(a => a.toggleAttribute("aria-current", a.dataset.v === v) || a.dataset.v === v && a.setAttribute("aria-current","page"));
  document.querySelectorAll(".nav a").forEach(a => { if (a.dataset.v === v) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  $("#main").innerHTML = (DB.config.principal === "nao" ? `<div class="panel warn" style="margin-bottom:14px;padding:10px 14px"><b>Cópia secundária (só consulta).</b> Lance os dados na cópia principal${DB.config.enderecoPrincipal ? `: <a href="${esc(DB.config.enderecoPrincipal)}" target="_blank" rel="noopener">${esc(DB.config.enderecoPrincipal)}</a>` : ""}. Altere em Banco de dados.</div>` : "") + V[v]();
  if (V[v].bind) V[v].bind();
  document.querySelectorAll("#main .panel table").forEach(tb => { if (tb.closest(".gantt") || tb.closest(".paper") || !tb.tHead) return;
    const cab = [...tb.tHead.rows[0].cells].map(th => th.textContent.trim()); tb.classList.add("rt");
    [...tb.tBodies].forEach(tbd => [...tbd.rows].forEach(tr => { let i = 0; [...tr.cells].forEach(td => { td.setAttribute("data-label", cab[i] || ""); i += td.colSpan || 1; }); })); });
  atualizarSino();
  const xo = $("#xlOut"), xi = $("#xlIn");
  if (xo) xo.onclick = exportarExcel;
  if (xi) xi.onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) importarExcel(f); };
}
window.addEventListener("hashchange", () => { const h = location.hash.replace("#",""); if (VIEWS.includes(h)) atual = h; render(); $("#side").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded","false"); $("#main").focus({preventScroll:true}); window.scrollTo(0,0); });
$("#menuBtn").onclick = () => { const o = $("#side").classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", o); };
$("#sino").onclick = abrirNotificacoes;
/* tema: automático (segue o computador), claro ou escuro */
const TEMAS = {auto: ["🌓", "automático"], light: ["☀️", "claro"], dark: ["🌙", "escuro"]};
let tema = (() => { try { return localStorage.getItem("cp_tema") || "auto"; } catch (e) { return "auto"; } })();
function aplicarTema(redesenhar){
  if (tema === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", tema);
  const [ic, nome] = TEMAS[tema] || TEMAS.auto, b = $("#temaBtn");
  b.firstChild.textContent = ic + " "; $("#temaTxt").textContent = "Tema: " + nome;
  b.setAttribute("aria-label", `Tema: ${nome}. Tocar para trocar`); b.title = `Tema: ${nome} (tocar para trocar)`;
  if (redesenhar) render();
}
$("#temaBtn").onclick = () => { tema = tema === "auto" ? "light" : tema === "light" ? "dark" : "auto"; try { localStorage.setItem("cp_tema", tema); } catch (e) {} aplicarTema(true); toast("Tema " + TEMAS[tema][1] + (tema === "auto" ? ": segue o tema do computador." : ".")); };
try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (tema === "auto") render(); }); } catch (e) {}
aplicarTema(false);
$("#verBtn").textContent = "Versão " + VERSAO + " · o que mudou";
$("#verBtn").onclick = () => dlg("O que mudou", `<p class="note" style="margin:0 0 10px">Você está usando a versão <b>${VERSAO}</b>${FORA ? " (no seu site)" : " (no Claude)"}.</p><ul class="notif">${MUDANCAS.map(([v, t]) => `<li><span class="pill p-prod tag">${v}</span><span>${esc(t)}</span></li>`).join("")}</ul>`, "");
$("#selCli").onchange = e => { const v = e.target.value; if (v === "__novo") { e.target.value = SEL; novoCliente(); } else escolherCliente(v); };
carregar().then(() => { setTimeout(avisar, 400); setTimeout(atualizarRegistrados, 1500); });
setInterval(async () => { atualizarSino(); if (FORA) await autoDrive(); if (driveDevido() && !document.hidden && !(FORA && gValido())) toast("Backup no Drive pendente: veja Notificações."); }, (FORA ? 10 : 30) * 60000);
if (FORA) setTimeout(autoDrive, 3000);
setTimeout(async () => { await limparLixeira(); await autoPasta(); await verificarBackupNovo(); }, 2500);
setInterval(autoPasta, 10 * 60000);
</script>
